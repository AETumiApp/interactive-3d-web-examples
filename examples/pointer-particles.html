<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer Particles — Interactive Three.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 13px ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,0.55);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">move the pointer &middot; hold to repel</div>

<!--
  Interactive particle field with Three.js r160 (0.160.0).
  A BufferGeometry point cloud drifts on a soft spring back to its home layout;
  the pointer attracts particles (or repels them while pressed). Additive
  blending gives the glow. Reduced-motion viewers get a calm static field.
  https://aetumi.app/interactive  (AETumi — AI-native 3D web platform)
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap DPR at 2
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 32;

// --- Build the particle cloud -------------------------------------------------
const COUNT = 9000;
const positions = new Float32Array(COUNT * 3); // live, animated positions
const home = new Float32Array(COUNT * 3);       // rest position each particle springs toward
const velocities = new Float32Array(COUNT * 3); // per-particle velocity
const colors = new Float32Array(COUNT * 3);

const color = new THREE.Color();
for (let i = 0; i < COUNT; i++) {
  // Distribute points in a flattened disc for a nice screen-filling field.
  const r = Math.sqrt(Math.random()) * 26;
  const a = Math.random() * Math.PI * 2;
  const x = Math.cos(a) * r;
  const y = Math.sin(a) * r * 0.62;
  const z = (Math.random() - 0.5) * 10;

  const idx = i * 3;
  home[idx] = positions[idx] = x;
  home[idx + 1] = positions[idx + 1] = y;
  home[idx + 2] = positions[idx + 2] = z;

  // Hue drifts from indigo to cyan across the radius.
  color.setHSL(0.62 - (r / 26) * 0.22, 0.8, 0.6);
  colors[idx] = color.r;
  colors[idx + 1] = color.g;
  colors[idx + 2] = color.b;
}

const geometry = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(positions, 3);
posAttr.setUsage(THREE.DynamicDrawUsage); // we rewrite positions every frame
geometry.setAttribute("position", posAttr);
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.16,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// --- Pointer tracking ---------------------------------------------------------
// Project the pointer onto the z = 0 plane so it lives in the same space as the
// particles.
const pointer = new THREE.Vector2(0, 0);
const pointerWorld = new THREE.Vector3(0, 0, 0);
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
let repel = false;
let pointerActive = false;

function updatePointer(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  pointerActive = true;
  raycaster.setFromCamera(pointer, camera);
  raycaster.ray.intersectPlane(plane, pointerWorld);
}

window.addEventListener("pointermove", (e) => updatePointer(e.clientX, e.clientY), { passive: true });
window.addEventListener("pointerdown", (e) => { repel = true; updatePointer(e.clientX, e.clientY); });
window.addEventListener("pointerup", () => { repel = false; });
window.addEventListener("pointerleave", () => { pointerActive = false; });

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation ----------------------------------------------------------------
const RADIUS = 9;         // pointer influence radius
const RADIUS2 = RADIUS * RADIUS;
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05); // clamp to stay stable on hitches
  const arr = geometry.attributes.position.array;

  for (let i = 0; i < COUNT; i++) {
    const idx = i * 3;
    let px = arr[idx], py = arr[idx + 1], pz = arr[idx + 2];
    let vx = velocities[idx], vy = velocities[idx + 1], vz = velocities[idx + 2];

    // Spring back toward the home position, with damping.
    vx += (home[idx] - px) * 2.4 * dt;
    vy += (home[idx + 1] - py) * 2.4 * dt;
    vz += (home[idx + 2] - pz) * 2.4 * dt;

    // Pointer force: attract by default, repel while pressed.
    if (pointerActive) {
      const dx = px - pointerWorld.x;
      const dy = py - pointerWorld.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < RADIUS2 && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        const falloff = (1 - d / RADIUS);
        const strength = falloff * falloff * 60 * dt;
        const dir = repel ? 1 : -1; // toward pointer, or away when repelling
        vx += (dx / d) * strength * dir;
        vy += (dy / d) * strength * dir;
      }
    }

    // Damping keeps motion smooth and eventually settled.
    vx *= 0.90; vy *= 0.90; vz *= 0.90;

    arr[idx] = px + vx * dt * 6;
    arr[idx + 1] = py + vy * dt * 6;
    arr[idx + 2] = pz + vz * dt * 6;
    velocities[idx] = vx; velocities[idx + 1] = vy; velocities[idx + 2] = vz;
  }

  geometry.attributes.position.needsUpdate = true;
  points.rotation.z += dt * 0.02; // very slow overall drift

  renderer.render(scene, camera);
}

if (reduce) {
  // Reduced motion: render the field once, no interaction loop.
  renderer.render(scene, camera);
} else {
  renderer.setAnimationLoop(animate);
}
</script>
</body>
</html>
